name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-15

    env:
      PROJECT: GTNW.xcodeproj
      SCHEME: GTNW_macOS

    steps:
    - uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build (macOS app)
      run: |
        xcodebuild build \
          -project "$PROJECT" \
          -scheme "$SCHEME" \
          -destination 'platform=macOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
          | tail -40

    - name: Test (GTNWTests)
      run: |
        xcodebuild test \
          -project "$PROJECT" \
          -scheme "$SCHEME" \
          -destination 'platform=macOS' \
          -only-testing:GTNWTests \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
          | tail -60
